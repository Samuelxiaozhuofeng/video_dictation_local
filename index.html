<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaClip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#F6F1E6',
              page: '#FFFDF7',
              line: '#DED5C2',
              ink: '#2B2521',
              mute: '#7A7066',
              green: '#2F6B4F',
              'green-soft': '#DCEBDF',
              ochre: '#B8702A',
              'ochre-soft': '#F5E3C6',
              highlight: '#FBEFB4',
              rose: '#B94A3A',
              'rose-soft': '#F5D9D2',
              shade: '#E8E1D2',
            },
            fontFamily: {
              sans: ['Inter', '"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
              serif: ['Fraunces', '"Songti SC"', 'Georgia', 'serif'],
              mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              card: '0 1px 2px rgba(43,37,33,.05), 0 6px 16px rgba(43,37,33,.06)',
              lift: '0 2px 4px rgba(43,37,33,.08), 0 16px 40px rgba(43,37,33,.14)',
            },
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-paper text-ink font-sans h-screen overflow-hidden antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
